<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DietBite — Coming Soon</title>

<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  background: linear-gradient(135deg, #f7fff4, #fff8ed);
  color: #17351f;
  overflow: hidden;
}

.container {
  width: 100%;
  max-width: 700px;
  padding: 40px 24px;
  text-align: center;
}

.logo {
  width: 105px;
  height: 105px;
  margin: 0 auto 28px;
  border-radius: 28px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 48px;
  font-weight: 800;
  letter-spacing: -6px;
  color: white;
  background: linear-gradient(135deg, #198754, #ff8a00);
  box-shadow: 0 18px 45px rgba(25, 135, 84, 0.22);
}

.brand {
  font-size: 22px;
  font-weight: 700;
  letter-spacing: 1px;
  margin-bottom: 28px;
}

h1 {
  font-size: clamp(42px, 9vw, 72px);
  line-height: 1.05;
  letter-spacing: -3px;
  margin-bottom: 20px;
}

h1 span {
  color: #f47c20;
}

.subtitle {
  font-size: 20px;
  line-height: 1.6;
  color: #607267;
  max-width: 520px;
  margin: 0 auto 32px;
}

.badge {
  display: inline-block;
  padding: 10px 20px;
  border-radius: 50px;
  background: #17351f;
  color: white;
  font-size: 14px;
  font-weight: 700;
  letter-spacing: 1.5px;
}

.footer {
  margin-top: 45px;
  font-size: 14px;
  color: #89968d;
}

@media (max-width: 500px) {
  .logo {
    width: 90px;
    height: 90px;
    font-size: 40px;
  }

  .subtitle {
    font-size: 17px;
  }
}
</style>
</head>

<body>

<div class="container">

  <div class="logo">dB</div>

  <div class="brand">DIETBITE</div>

  <h1>
    Food That <span>Fits</span><br>
    Your Goals.
  </h1>

  <p class="subtitle">
    Something delicious is coming.
    We're creating a smarter way to discover food
    that fits your nutrition goals.
  </p>

  <div class="badge">
    COMING SOON
  </div>

  <div class="footer">
    © 2026 DietBite · Eat Smart. Live Better.
  </div>

</div>

</body>
</html>
